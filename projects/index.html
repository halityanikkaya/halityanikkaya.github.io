    const initPublications = () => {
        const data = portfolioDataRaw;
        if (!data) return;
        
        const pubList = document.getElementById('projects-list');
        if (!pubList) return;
        
        const lang = document.documentElement.lang || 'tr';
        
        const enCategories = {
            "Yayımlanmış Kitaplar": "Published Books",
            "Kitapta Bölümler": "Book Chapters",
            "Yayımlanmış Makaleler": "Published Articles",
            "Monografiler": "Monographs",
            "Diğer Yayınlar": "Other Publications",
            "Projeler": "Projects",
            "Kongre/Sempozyumlar": "Congresses / Symposiums",
        };
        
        data.publications.forEach((cat, index) => {
            if (cat.category !== 'Projeler') return;
            const catContainer = document.createElement('div');
            catContainer.className = 'projects-container';
            
            cat.items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                let mainText = item;
                let summaryText = '';
                
                if (item.includes('Proje Özeti:')) {
                    const parts = item.split('Proje Özeti:');
                    mainText = parts[0].trim();
                    summaryText = parts[1].trim();
                } else if (item.includes('Project Summary:')) {
                    const parts = item.split('Project Summary:');
                    mainText = parts[0].trim();
                    summaryText = parts[1].trim();
                }
                
                // Make the project title bold by matching the quoted part
                mainText = mainText.replace(/“([^”]+)”/, '<strong>“$1”</strong>');
                
                let contentHTML = `<p class="project-main">${mainText}</p>`;
                if (summaryText) {
                    contentHTML += `<div class="project-summary"><strong>Proje Özeti:</strong> ${summaryText}</div>`;
                }
                
                card.innerHTML = contentHTML;
                catContainer.appendChild(card);
            });
            
            pubList.appendChild(catContainer);
        });
    };
    initPublications();
</script>
