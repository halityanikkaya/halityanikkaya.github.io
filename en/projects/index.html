    const initPublications = () => {
        const data = portfolioDataRaw;
        if (!data) return;
        
        const pubList = document.getElementById('projects-list');
        if (!pubList) return;
        
        data.publications.forEach((cat, index) => {
            if (cat.category !== 'Projeler') return;
            const catContainer = document.createElement('div');
            catContainer.className = 'projects-container';
            
            cat.items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                let text = item;
                
                text = text.replace(/Proje Özeti:/gi, 'Project Summary:')
                           .replace(/Araştırmacı/g, 'Researcher')
                           .replace(/Yürütücü/g, 'Principal Investigator')
                           .replace(/Koordinatör/g, 'Coordinator')
                           .replace(/Danışman/g, 'Advisor')
                           .replace(/Türkiye Bilimler Akademisi/g, 'Turkish Academy of Sciences')
                           .replace(/Cumhurbaşkanlığı, Strateji Bütçe Başkanlığı/g, 'Presidency of Strategy and Budget')
                           .replace(/Bilimsel Araştırma Projesi/g, 'Scientific Research Project')
                           .replace(/Araştırma Üniversite Destek Programı/g, 'Research University Support Program')
                           .replace(/Proje No:/g, 'Project No:')
                           .replace(/Gebze Teknik Üniversitesi/g, 'Gebze Technical University')
                           .replace(/Gebze Ticaret Odası/g, 'Gebze Chamber of Commerce')
                           .replace(/Teknoloji Transfer Ofisi Projesi/g, 'Technology Transfer Office Project')
                           .replace(/İBB İnsan Kaynakları ve Eğitim Daire Başkanlığı/g, 'Istanbul Metropolitan Municipality Human Resources and Education Department')
                           .replace(/Projede, kamu alımlarının döngüsel, doğa-pozitif ve sosyal açıdan adil kentsel dönüşüm için/g, 'The project aims to use public procurement as a strategic tool for circular, nature-positive, and socially just urban transformation.')
                           .replace(/Türkiye Bilimsel ve Teknolojik Araştırma Kurumu \(TÜBİTAK\)/g, 'The Scientific and Technological Research Institution of Türkiye (TÜBİTAK)')
                           .replace(/SBB-TÜBA Tematik Araştırmaları: Yapay Zekâ Teknolojilerinin Sosyal ve Kültürel Etkileri/g, 'SBB-TÜBA Thematic Researches: Social and Cultural Impacts of Artificial Intelligence Technologies')
                           .replace(/Çevre Politikaları Bağlamında Doğrudan Yabancı Yatırımların Emisyonlar Üzerindeki Etkisi: Küresel Değere Zincirleri Çerçevesinde Bir Analiz/g, 'The Impact of Foreign Direct Investments on Emissions in the Context of Environmental Policies: An Analysis within the Framework of Global Value Chains')
                           .replace(/Sosyal ve Kültürel Alanda Türkiye’de Araştırma Potansiyeli ve Karşılaşılan Sorunlar ile Çözüm Önerileri/g, 'Research Potential, Encountered Problems and Solution Proposals in the Social and Cultural Fields in Türkiye')
                           .replace(/Kişisel Deneyimler ve Bireysel Emeklilik Tasarrufları/g, 'Personal Experiences and Individual Retirement Savings')
                           .replace(/Doğal Kaynaklar, Küresel Değer Zincirleri ve Sektörel Büyüme: EORA Veri Tabanından Kanıtlar/g, 'Natural Resources, Global Value Chains and Sectoral Growth: Evidence from the EORA Database')
                           .replace(/Küresel Değer Zincirlerine Sektörel Katılım ve İnovasyon Sisteminin Sektörel Performansı/g, 'Sectoral Participation in Global Value Chains and the Sectoral Performance of the Innovation System')
                           .replace(/Çayırova İlçesinde Kentsel Yaşam Kalitesini ve Kent Cazibesini Artırmaya Yönelik Stratejik Yol Haritası Hazırlanması/g, 'Preparation of a Strategic Roadmap for Increasing Urban Quality of Life and City Attractiveness in Çayırova District')
                           .replace(/Türkiye’de Bireysel Emeklilik Politikalarının Sistemdeki Katılımcı Sayılarına ve Katkı Miktarlarına Etkisi/g, 'The Impact of Individual Pension Policies on the Number of Participants and Contribution Amounts in the System in Türkiye')
                           .replace(/Üretim ve Küresel Değer Zinciri Uzunluklarının Endüstrilerin Sektörel Performansı Üzerindeki Etkileri/g, 'The Effects of Production and Global Value Chain Lengths on the Sectoral Performance of Industries')
                           .replace(/Tarihi Merkezlerde Yaratıcılık ve Girişimciliğin Gelişimi için İş İntübatörleri-LEARNING/g, 'Business Incubators for the Development of Creativity and Entrepreneurship in Historical Centers-LEARNING')
                           .replace(/\bve\b/g, 'and'); // Replace standalone "ve" with "and" inside project details
                
                const months = {
                    'Ocak': 'January', 'Şubat': 'February', 'Mart': 'March', 'Nisan': 'April',
                    'Mayıs': 'May', 'Haziran': 'June', 'Temmuz': 'July', 'Ağustos': 'August',
                    'Eylül': 'September', 'Ekim': 'October', 'Kasım': 'November', 'Aralık': 'December'
                };
                for (const [tr, en] of Object.entries(months)) {
                    let regex = new RegExp('\\b' + tr + '\\b', 'gi');
                    text = text.replace(regex, en);
                }
                
                let mainText = text;
                let summaryText = '';
                
                if (text.includes('Project Summary:')) {
                    const parts = text.split('Project Summary:');
                    mainText = parts[0].trim();
                    summaryText = parts[1].trim();
                }
                
                // Match standard quotes and curly quotes
                mainText = mainText.replace(/[“"]([^”"]+)[”"]/, '<strong>“$1”</strong>');
                
                let contentHTML = `<p class="project-main">${mainText}</p>`;
                if (summaryText) {
                    contentHTML += `<div class="project-summary"><strong>Project Summary:</strong> ${summaryText}</div>`;
                }
                
                card.innerHTML = contentHTML;
                catContainer.appendChild(card);
            });
            
            pubList.appendChild(catContainer);
        });
    };
    initPublications();
</script>
