    const initPublications = () => {
        const data = portfolioDataRaw;
        if (!data) return;
        
        const pubList = document.getElementById('projects-list');
        if (!pubList) return;
        
        data.publications.forEach((cat, index) => {
            if (cat.category !== 'Projeler') return;
            const catContainer = document.createElement('div');
            catContainer.className = 'projects-container';
            
            cat.items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                let text = item;
                
                // Titles
                text = text.replace('SBB-TÜBA Tematik Araştırmaları: Yapay Zekâ Teknolojilerinin Sosyal ve Kültürel Etkileri', 'SBB-TÜBA Thematic Researches: Social and Cultural Impacts of Artificial Intelligence Technologies');
                text = text.replace('Çevre Politikaları Bağlamında Doğrudan Yabancı Yatırımların Emisyonlar Üzerindeki Etkisi: Küresel Değere Zincirleri Çerçevesinde Bir Analiz', 'The Impact of Foreign Direct Investments on Emissions in the Context of Environmental Policies: An Analysis within the Framework of Global Value Chains');
                text = text.replace('Sosyal ve Kültürel Alanda Türkiye’de Araştırma Potansiyeli ve Karşılaşılan Sorunlar ile Çözüm Önerileri', 'Research Potential, Encountered Problems and Solution Proposals in the Social and Cultural Fields in Türkiye');
                text = text.replace('Kişisel Deneyimler ve Bireysel Emeklilik Tasarrufları', 'Personal Experiences and Individual Retirement Savings');
                text = text.replace('Doğal Kaynaklar, Küresel Değer Zincirleri ve Sektörel Büyüme: EORA Veri Tabanından Kanıtlar', 'Natural Resources, Global Value Chains and Sectoral Growth: Evidence from the EORA Database');
                text = text.replace('Küresel Değer Zincirlerine Sektörel Katılım ve İnovasyon Sisteminin Sektörel Performansı', 'Sectoral Participation in Global Value Chains and the Sectoral Performance of the Innovation System');
                text = text.replace('Çayırova İlçesinde Kentsel Yaşam Kalitesini ve Kent Cazibesini Artırmaya Yönelik Stratejik Yol Haritası Hazırlanması', 'Preparation of a Strategic Roadmap for Increasing Urban Quality of Life and City Attractiveness in Çayırova District');
                text = text.replace('Türkiye’de Bireysel Emeklilik Politikalarının Sistemdeki Katılımcı Sayılarına ve Katkı Miktarlarına Etkisi', 'The Impact of Individual Pension Policies on the Number of Participants and Contribution Amounts in the System in Türkiye');
                text = text.replace('Üretim ve Küresel Değer Zinciri Uzunluklarının Endüstrilerin Sektörel Performansı Üzerindeki Etkileri', 'The Effects of Production and Global Value Chain Lengths on the Sectoral Performance of Industries');
                text = text.replace('Tarihi Merkezlerde Yaratıcılık ve Girişimciliğin Gelişimi için İş İntübatörleri-LEARNING', 'Business Incubators for the Development of Creativity and Entrepreneurship in Historical Centers-LEARNING');
                
                // Summaries
                text = text.replace('Proje Özeti:', 'Project Summary:');
                text = text.replace('Projede, kamu alımlarının döngüsel, doğa-pozitif ve sosyal açıdan adil kentsel dönüşüm için stratejik bir araç olarak kullanılması amaçlanmaktadır. Karlstad (İsveç), Kocaeli (Türkiye) ve Timișoara (Romanya)’da yürütülecek Urban Living Lab uygulamaları aracılığıyla, çevresel ve sosyal kriterleri kamu alım süreçlerine entegre eden SymbioCity Procurement Model geliştirilecek ve test edilecektir. Proje kapsamında ülkeler arası kamu alım mevzuatlarının ve uygulamalarının karşılaştırılması, ortak gösterge ve değerlendirme çerçevesinin geliştirilmesi ve döngüsellik, sosyal değer, biyoçeşitlilik ve yaşam döngüsü maliyetlerini içeren satın alma kriterlerinin oluşturulmasına katkı sağlanacaktır. Toplam 882.789,50 Euro bütçeye sahip olan proje, İsveç, Türkiye ve Romanya’dan 9 ortaklı uluslararası bir konsorsiyum tarafından yürütülmektedir.', 'The project aims to use public procurement as a strategic tool for circular, nature-positive, and socially just urban transformation. Through Urban Living Lab applications to be carried out in Karlstad (Sweden), Kocaeli (Türkiye), and Timișoara (Romania), the SymbioCity Procurement Model, which integrates environmental and social criteria into public procurement processes, will be developed and tested. Within the scope of the project, cross-country public procurement regulations and practices will be compared, a common indicator and evaluation framework will be developed, and a contribution will be made to the creation of purchasing criteria including circularity, social value, biodiversity, and life cycle costs. The project, with a total budget of 882,789.50 Euros, is carried out by an international consortium of 9 partners from Sweden, Türkiye, and Romania.');
                text = text.replace('Avrupa Birliği İklim Değişikliğine Uyum Misyonu (EU Mission on Adaptation to Climate Change) kapsamında desteklenen projede, aşırı sıcaklık risklerine karşı sağlık odaklı ve sosyal açıdan adil iklim uyum çözümlerinin geliştirilmesine katkı sağlanmıştır. Proje, demonstrasyon şehirlerinde uygulanacak müdahalelerin sağlık, sosyal eşitsizlik ve davranışsal etkilerini değerlendirmek üzere disiplinlerarası ve kanıta dayalı bir yaklaşım benimsemektedir. 10 milyon Euro bütçeye sahip olan proje, 10 ülkeden 28 ortaklı uluslararası bir konsorsiyum tarafından yürütülmektedir.', 'Supported by the European Union Mission on Adaptation to Climate Change, the project contributes to the development of health-oriented and socially just climate adaptation solutions against extreme heat risks. The project adopts an interdisciplinary and evidence-based approach to evaluate the health, social inequality, and behavioral impacts of interventions to be implemented in demonstration cities. The project, with a budget of 10 million Euros, is carried out by an international consortium of 28 partners from 10 countries.');
                
                // Keywords & Roles
                text = text.replace('Araştırmacı', 'Researcher');
                text = text.replace('Yürütücü', 'Principal Investigator');
                text = text.replace('Koordinatör', 'Coordinator');
                text = text.replace('Danışman', 'Advisor');
                text = text.replace('Türkiye Bilimler Akademisi', 'Turkish Academy of Sciences');
                text = text.replace('Cumhurbaşkanlığı, Strateji Bütçe Başkanlığı', 'Presidency of Strategy and Budget');
                text = text.replace('Bilimsel Araştırma Projesi', 'Scientific Research Project');
                text = text.replace('Araştırma Üniversite Destek Programı', 'Research University Support Program');
                text = text.replace('Proje No:', 'Project No:');
                text = text.replace('Gebze Teknik Üniversitesi', 'Gebze Technical University');
                text = text.replace('Gebze Ticaret Odası', 'Gebze Chamber of Commerce');
                text = text.replace('Teknoloji Transfer Ofisi Projesi', 'Technology Transfer Office Project');
                text = text.replace('İBB İnsan Kaynakları ve Eğitim Daire Başkanlığı', 'Istanbul Metropolitan Municipality Human Resources and Education Department');
                text = text.replace('Türkiye Bilimsel ve Teknolojik Araştırma Kurumu (TÜBİTAK)', 'The Scientific and Technological Research Institution of Türkiye (TÜBİTAK)');
                
                const months = {
                    'Ocak': 'January', 'Şubat': 'February', 'Mart': 'March', 'Nisan': 'April',
                    'Mayıs': 'May', 'Haziran': 'June', 'Temmuz': 'July', 'Ağustos': 'August',
                    'Eylül': 'September', 'Ekim': 'October', 'Kasım': 'November', 'Aralık': 'December'
                };
                for (const [tr, en] of Object.entries(months)) {
                    let regex = new RegExp('\\b' + tr + '\\b', 'gi');
                    text = text.replace(regex, en);
                }
                
                // Fix 've' carefully
                text = text.replace(/\bve\b/g, 'and');
                
                let mainText = text;
                let summaryText = '';
                
                if (text.includes('Project Summary:')) {
                    const parts = text.split('Project Summary:');
                    mainText = parts[0].trim();
                    summaryText = parts[1].trim();
                }
                
                // Match standard quotes and curly quotes for bolding
                mainText = mainText.replace(/[“"]([^”"]+)[”"]/, '<strong>“$1”</strong>');
                
                let contentHTML = `<p class="project-main">${mainText}</p>`;
                if (summaryText) {
                    contentHTML += `<div class="project-summary"><strong>Project Summary:</strong> ${summaryText}</div>`;
                }
                
                card.innerHTML = contentHTML;
                catContainer.appendChild(card);
            });
            
            pubList.appendChild(catContainer);
        });
    };
    initPublications();
</script>
